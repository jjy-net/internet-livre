# Configuracao Nginx para o No Jyy (jyy.com.br)
# Salve em: /etc/nginx/sites-available/jyy.com.br
# Ative com: sudo ln -s /etc/nginx/sites-available/jyy.com.br /etc/nginx/sites-enabled/
# Gere SSL com: sudo certbot --nginx -d jyy.com.br -d www.jyy.com.br

server {
    listen 80;
    listen [::]:80;
    server_name jyy.com.br www.jyy.com.br;

    # Redireciona HTTP para HTTPS (o Certbot pode fazer isso automaticamente)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:4870;
        proxy_http_version 1.1;

        # Cabecalhos obrigatorios para conexao WebSocket (chat e telemetria P2P)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts longos para manter o WebSocket ativo sem desconexoes
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        client_max_body_size 100M;
    }
}
