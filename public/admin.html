<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JJY - Portal Restrito do Administrador</title>
    <meta http-equiv="refresh" content="0; url=/#admin" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #020617;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 20px;
        padding: 36px 32px;
        max-width: 440px;
        width: 90%;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      }
      .icon-box {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px auto;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(244, 63, 94, 0.2), rgba(225, 29, 72, 0.4));
        border: 1px solid rgba(244, 63, 94, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fb7185;
        font-size: 26px;
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 9999px;
        background: rgba(244, 63, 94, 0.15);
        color: #fb7185;
        border: 1px solid rgba(244, 63, 94, 0.3);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 10px 0;
        color: #ffffff;
        font-weight: 700;
      }
      p {
        font-size: 13px;
        color: #94a3b8;
        line-height: 1.6;
        margin: 0 0 24px 0;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: linear-gradient(135deg, #e11d48, #be123c);
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        font-size: 13px;
        padding: 12px 28px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
        transition: transform 0.15s ease, background 0.2s ease;
      }
      a.btn:hover {
        background: linear-gradient(135deg, #f43f5e, #e11d48);
        transform: translateY(-1px);
      }
      .note {
        margin-top: 20px;
        font-size: 11px;
        color: #64748b;
      }
    </style>
    <script>
      try {
        window.location.replace('/#admin');
      } catch (e) {
        window.location.href = '/#admin';
      }
    </script>
  </head>
  <body>
    <div class="card">
      <div class="icon-box">🛡️</div>
      <div class="badge">Acesso Restrito • Blue Team</div>
      <h1>Portal do Administrador JJY</h1>
      <p>Área restrita de controle central, CFTV, telemetria, contenção Zero-Trust e publicação Nsite Nostr.</p>
      <a href="/#admin" class="btn">Abrir Painel Autenticado</a>
      <div class="note">🔒 Protegido por criptografia e Fail2Ban nativo.</div>
    </div>
  </body>
</html>
