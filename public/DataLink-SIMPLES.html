<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataLink Mesh</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#1e293b;min-height:100vh;color:#fff;padding:10px}
.container{max-width:500px;margin:0 auto}
.card{background:#334155;border-radius:10px;padding:15px;margin-bottom:10px}
h1{font-size:18px;margin-bottom:10px;color:#60a5fa}
input{width:100%;padding:10px;border:1px solid #475569;border-radius:5px;background:#1e293b;color:#fff;margin-bottom:10px;font-size:14px}
button{width:100%;padding:12px;border:none;border-radius:5px;background:#3b82f6;color:#fff;font-size:14px;font-weight:bold;cursor:pointer;margin-top:5px}
button:hover{background:#2563eb}
.hidden{display:none}
.message{background:#475569;border-radius:5px;padding:10px;margin-bottom:5px}
.message.sent{background:#1e40af;margin-left:20px}
.message.received{background:#334155;margin-right:20px}
.error{background:#dc2626;color:#fff;padding:10px;border-radius:5px;margin-top:10px;font-size:12px}
.debug{background:#0f172a;color:#94a3b8;padding:10px;border-radius:5px;margin-top:10px;font-size:10px;font-family:monospace;max-height:100px;overflow-y:auto}
</style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="login-screen" class="container">
<div class="card">
<h1>🌐 DataLink Mesh</h1>
<p style="font-size:12px;color:#94a3b8;margin-bottom:15px">Configure seu usuário</p>

<input type="text" id="username" placeholder="Seu nome (mínimo 2 caracteres)">
<input type="password" id="password" placeholder="Senha (mínimo 8 caracteres)">
<input type="password" id="password2" placeholder="Confirme a senha">

<label style="display:flex;align-items:center;gap:8px;margin:10px 0;color:#f59e0b;font-size:12px">
<input type="checkbox" id="temporary" style="width:auto">
<span>🕐 Modo Temporário (apaga dados ao sair)</span>
</label>

<button onclick="login()">🚀 Entrar</button>

<div id="error" class="error hidden"></div>
<div id="debug" class="debug">Aguardando...</div>
</div>
</div>

<!-- TELA PRINCIPAL -->
<div id="main-screen" class="container hidden">
<div class="card">
<h1>💬 Chat</h1>
<p style="font-size:12px;color:#94a3b8">Usuário: <span id="user-name"></span></p>
</div>

<div class="card">
<div id="messages" style="min-height:200px;max-height:400px;overflow-y:auto;margin-bottom:10px;background:#1e293b;border-radius:5px;padding:10px">
<p style="text-align:center;color:#64748b;font-size:12px">Nenhuma mensagem</p>
</div>

<input type="text" id="msg-input" placeholder="Digite sua mensagem..." onkeypress="if(event.key==='Enter')sendMsg()">
<button onclick="sendMsg()">📤 Enviar</button>
<button onclick="clearChat()" style="background:#f59e0b;color:#000;margin-top:5px">🧹 Limpar Chat</button>
<button onclick="logout()" style="background:#dc2626;margin-top:5px">🚪 Sair</button>
</div>
</div>

<script>
// Estado
var user = '';
var pass = '';
var temp = false;
var messages = [];
var channel = null;

// Debug
function log(msg) {
    var d = document.getElementById('debug');
    if (d) {
        d.innerHTML += '<br>' + msg;
        d.scrollTop = d.scrollHeight;
    }
    console.log(msg);
}

// Login
function login() {
    log('Iniciando login...');
    
    var u = document.getElementById('username').value.trim();
    var p = document.getElementById('password').value;
    var p2 = document.getElementById('password2').value;
    var t = document.getElementById('temporary').checked;
    
    log('Nome: ' + u);
    log('Senha: ' + (p ? p.length + ' chars' : 'vazia'));
    
    // Validações
    if (u.length < 2) {
        showError('Nome muito curto (mínimo 2)');
        return;
    }
    
    if (p.length < 8) {
        showError('Senha muito curta (mínimo 8)');
        return;
    }
    
    if (p !== p2) {
        showError('Senhas não coincidem');
        return;
    }
    
    log('Validações OK');
    
    // Salvar
    user = u;
    pass = p;
    temp = t;
    
    try {
        localStorage.setItem('user', u);
        localStorage.setItem('pass', btoa(p));
        localStorage.setItem('temp', t ? '1' : '0');
        log('Dados salvos');
    } catch(e) {
        showError('Erro ao salvar: ' + e.message);
        return;
    }
    
    // Canal de comunicação
    try {
        channel = new BroadcastChannel('datalink');
        channel.onmessage = receiveMsg;
        log('Canal criado');
    } catch(e) {
        log('Canal não disponível: ' + e.message);
    }
    
    // Mostrar tela principal
    log('Mostrando interface...');
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('main-screen').classList.remove('hidden');
    document.getElementById('user-name').textContent = u;
    
    // Carregar mensagens
    loadMsgs();
    
    log('✅ LOGIN OK!');
}

// Enviar mensagem
function sendMsg() {
    var input = document.getElementById('msg-input');
    var text = input.value.trim();
    if (!text) return;
    
    var msg = {
        id: Date.now(),
        from: user,
        text: text,
        time: new Date().toLocaleTimeString()
    };
    
    messages.push(msg);
    saveMsgs();
    showMsg(msg, 'sent');
    
    // Enviar para outras abas
    if (channel) {
        channel.postMessage(msg);
    }
    
    input.value = '';
    log('Mensagem enviada');
}

// Receber mensagem
function receiveMsg(event) {
    var msg = event.data;
    if (msg.from !== user) {
        messages.push(msg);
        saveMsgs();
        showMsg(msg, 'received');
        log('Mensagem recebida de ' + msg.from);
    }
}

// Mostrar mensagem
function showMsg(msg, type) {
    var container = document.getElementById('messages');
    
    // Remover placeholder
    if (container.querySelector('p')) {
        container.innerHTML = '';
    }
    
    var div = document.createElement('div');
    div.className = 'message ' + type;
    div.innerHTML = '<div style="font-size:11px;color:#60a5fa;margin-bottom:3px">' + msg.from + ' - ' + msg.time + '</div>' +
                    '<div style="font-size:13px">' + msg.text + '</div>';
    
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

// Salvar mensagens
function saveMsgs() {
    try {
        localStorage.setItem('msgs', JSON.stringify(messages.slice(-50)));
    } catch(e) {
        log('Erro ao salvar msgs: ' + e.message);
    }
}

// Carregar mensagens
function loadMsgs() {
    try {
        var data = localStorage.getItem('msgs');
        if (data) {
            messages = JSON.parse(data);
            messages.forEach(function(m) {
                showMsg(m, m.from === user ? 'sent' : 'received');
            });
            log('Mensagens carregadas: ' + messages.length);
        }
    } catch(e) {
        log('Erro ao carregar msgs: ' + e.message);
    }
}

// Limpar chat
function clearChat() {
    if (confirm('Limpar todas as mensagens?')) {
        messages = [];
        saveMsgs();
        document.getElementById('messages').innerHTML = '<p style="text-align:center;color:#64748b;font-size:12px">Chat limpo</p>';
        log('Chat limpo');
    }
}

// Sair
function logout() {
    if (temp) {
        if (confirm('⚠️ MODO TEMPORÁRIO\n\nApagar todos os dados?')) {
            localStorage.clear();
            location.reload();
        }
    } else {
        if (confirm('Sair?')) {
            localStorage.clear();
            location.reload();
        }
    }
}

// Mostrar erro
function showError(msg) {
    var el = document.getElementById('error');
    el.textContent = '⚠️ ' + msg;
    el.classList.remove('hidden');
    log('ERRO: ' + msg);
    setTimeout(function() {
        el.classList.add('hidden');
    }, 3000);
}

// Auto-login
window.onload = function() {
    log('Página carregada');
    
    var u = localStorage.getItem('user');
    var p = localStorage.getItem('pass');
    var t = localStorage.getItem('temp') === '1';
    
    if (u && p) {
        try {
            user = u;
            pass = atob(p);
            temp = t;
            
            // Canal
            try {
                channel = new BroadcastChannel('datalink');
                channel.onmessage = receiveMsg;
            } catch(e) {}
            
            // Mostrar interface
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            document.getElementById('user-name').textContent = u + (t ? ' 🕐' : '');
            
            loadMsgs();
            log('✅ Auto-login OK');
            
        } catch(e) {
            log('Erro no auto-login: ' + e.message);
            localStorage.clear();
        }
    } else {
        log('Aguardando login');
    }
};
</script>
</body>
</html>
