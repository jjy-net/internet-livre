# Configuracao Nginx para o No Jjy (jjy.com.br)
# Salve em: /etc/nginx/sites-available/jjy.com.br
# Ative com: sudo ln -s /etc/nginx/sites-available/jjy.com.br /etc/nginx/sites-enabled/
# Gere SSL com: sudo certbot --nginx -d jjy.com.br -d www.jjy.com.br

# Rate limiting global — protege contra DDoS e brute-force
limit_req_zone $binary_remote_addr zone=jjy_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=jjy_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=jjy_conn:10m;

# Redirecionar HTTP para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name jjy.com.br www.jjy.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jjy.com.br www.jjy.com.br;

    # Certificados SSL (gerenciados pelo Certbot)
    # ssl_certificate /etc/letsencrypt/live/jjy.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jjy.com.br/privkey.pem;

    # SEGURANÇA: Protocolos e cifras fortes
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # SEGURANÇA: Cabeçalhos de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

    # Ocultar versao do Nginx
    server_tokens off;

    # Limite de tamanho do corpo da requisicao
    client_max_body_size 20M;

    # Limite de conexoes simultaneas por IP
    limit_conn jjy_conn 20;

    # Rotas de API — rate limit mais restritivo
    location /api/ {
        limit_req zone=jjy_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:4870;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rota principal e WebSocket
    location / {
        limit_req zone=jjy_general burst=50 nodelay;

        proxy_pass http://127.0.0.1:4870;
        proxy_http_version 1.1;

        # Cabecalhos obrigatorios para conexao WebSocket (chat e telemetria P2P)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts longos para manter o WebSocket ativo sem desconexoes
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Bloquear acesso a arquivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
