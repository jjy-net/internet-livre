<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Jjy - Suite Offline & P2P</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Jjy: Comunicação Segura Offline, Chat LAN/P2P, QR Studio, Modem Acústico, Esteganografia e Central de Alertas." />
    <meta name="theme-color" content="#06060f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jjy" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      /* Cor de fundo antes do CSS carregar (evita piscar branco) */
      html { background-color: #06060f; color: #eef0ff; }
      html[data-skin="matrix"] { background-color: #030805; }
      html[data-skin="sec"] { background-color: #0a0d12; }
    </style>
    <script>
      document.documentElement.classList.add("dark");
      document.documentElement.setAttribute("data-theme", "dark");
      // Aplica o tema salvo antes da primeira pintura
      try {
        var jjyPrefs = JSON.parse(localStorage.getItem("jjy_shell_prefs_v1") || "{}");
        document.documentElement.setAttribute("data-skin", jjyPrefs.skin || "cyber");
      } catch (e) {
        document.documentElement.setAttribute("data-skin", "cyber");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Service Worker registrado com sucesso:', registration.scope);
            })
            .catch((error) => {
              console.log('Falha ao registrar Service Worker:', error);
            });
        });
      }
    </script>
  </body>
</html>
